<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Política de contenido: solo se ejecuta el código de la app (y el respaldo de cdnjs); ningún manejador en línea.
     Si cambias el <script> del tema, actualiza su hash sha256 en script-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-MH4vD6VsGKQQooLw87iDDPH4XD+X2WV3CW/tNPxMAnc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PERCONSUR</title>
<meta name="description" content="PERCONSUR: notas de entrega (División Puerto) y asignación de unidades (División Campo).">
<meta name="copyright" content="PERCONSUR DE NAYARIT GROUP">
<meta name="application-name" content="PERCONSUR">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PERCONSUR">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F5F8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/icons/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="preload" href="./vendor/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./vendor/fonts/inter.css">
<link rel="stylesheet" href="./vendor/fonts/archivo.css">
<link rel="stylesheet" href="./vendor/fonts/jetbrains-mono.css">

<link rel="stylesheet" href="./styles/units.css">
<link rel="stylesheet" href="./styles/desktop.css">
<script>
  /* Aplica el tema elegido antes del primer pintado (evita destello). Si la app ya se abrió en esta sesión, la pantalla
     de carga no repite la apertura (ui/components/opening.js) */
  try { var t = localStorage.getItem('pcs-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  try { if (sessionStorage.getItem('pcs-opened')) document.documentElement.classList.add('sp-warm'); } catch (e) {}
</script>
</head>
<body>
<div id="splash" role="status" aria-label="Abriendo PERCONSUR">
  <div class="sp-inner">
    <img src="./assets/brand/perconsur-mark.png" alt="" class="sp-mark" decoding="sync">
    <span class="wordmark sp-word">PERCONSUR</span>
    <span class="sp-line" aria-hidden="true"><i></i></span>
    <p class="sp-msg"></p>
  </div>
  <span class="sp-legal">PERCONSUR DE NAYARIT GROUP</span>
</div>
<main id="view"></main>
<noscript><p style="padding:24px;font-family:-apple-system,Arial">PERCONSUR necesita JavaScript activado.</p></noscript>
<script type="module" src="./src/auth/gate.js"></script>
</body>
</html>
